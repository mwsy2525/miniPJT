goal: '한국어를 쓰는 CCAR-F(Anthropic Claude Certified Architect – Foundations) 응시 예정자를 위한 LangGraph
  에이전트를 만든다. 주된 목적은 모의시험이다. 에이전트는 POST /query 하나로 다음을 제공한다: 검수된 문제 은행에서 영어 모의문제 출제,
  정답 키와 비교하는 결정적 채점과 저장된 해설 세트(한영 병기 해석, 문제 의도, 정답인 이유, 보기별 오답인 이유, 학습 포인트, 참고 공식문서), 채점 전 개념 힌트와 채점 후 문항 질의(AI),
  user_id별 오답·진도 기록과 조회, 보조 기능으로 공식 문서 기반 한국어 학습 Q&A(RAG). 결과는 {answer, contexts, trace}로
  돌려주고, evaluation/test_queries.csv 20문항으로 합격 기준을 검증한다.'
task_type: code
brownfield_context:
  project_type: greenfield
  context_references:
  - path: c:\Users\Admin\Desktop\workspace\miniPJT
    role: primary
    summary: Mini PJT 제출 저장소. src/agent.py, src/tools.py, src/retriever.py, data/,
      evaluation/ 고정 구조로 CCAR-F 학습 에이전트를 구현한다.
  existing_patterns:
  - 'Mini PJT 제출 규약: src/agent.py(에이전트 그래프), src/tools.py(도메인 도구), src/retriever.py(RAG),
    data/, evaluation/'
  - langchain.agents의 create_agent로 에이전트를 생성한다.
  - POST /query로 question 필드를 읽고 answer, contexts, trace를 돌려준다.
  - 비밀 값은 .env에서 읽는다.
  - evaluation/test_queries.csv 인-아웃 세트(positive/negative/edge/guardrail)와 강의 규약 컬럼(id,
    category, input, expected_traits, forbidden, expected_tools, note)
  existing_dependencies:
  - langchain
  - langgraph
  - langchain-aws (ChatBedrockConverse, BedrockEmbeddings)
  - chromadb / langchain-chroma
  - sqlite3
  - python-dotenv
constraints:
- Python, LangChain, LangGraph를 쓴다. LLM은 Amazon Bedrock ChatBedrockConverse를 쓰고, 에이전트는
  langchain.agents의 create_agent로 만든다. 모델 ID와 리전은 .env에서 읽는다.
- '폴더 구조를 고정한다: src/agent.py(에이전트 그래프), src/tools.py(도메인 도구), src/retriever.py(RAG
  파이프라인), data/(문서·데이터), evaluation/(test_queries.csv와 평가 리포트).'
- 비밀 값은 모두 .env에서 읽는다.
- '입력 규약: POST /query, 바디는 {question(필수), user_id?, session_id?}이고 question 필드를 읽는다.'
- '출력 규약: 응답 최상위 키는 answer, contexts, trace 세 개뿐이다.'
- contexts는 모든 도구에서 항상 list[str]이고 null이 되지 않는다. data/docs/ 원문 구절이나 웹 폴백으로 가져온 허용 도메인 공식 문서 구절만 담는다. 사용자 답안과
  채점 기준표는 넣지 않는다. 출제 응답과 진도 조회 응답의 contexts는 빈 리스트다(출제 시 정답 노출 방지). 출제 응답의
  trace.sources도 빈 리스트다.
- 'trace 스키마를 고정한다: {tool_calls:[{name,args}], problem_id, grading:{chosen,correct}|null,
  refusal_reason:str|null, db_writes:int, sources:[{url,doc_path,chunk_id}]}. 근거 URL과
  문서 위치는 trace.sources에 넣는다.'
- trace.tool_calls의 name은 test_queries.csv의 expected_tools 값과 정확히 같은 문자열이다.
- '최소 도구는 4개다: (1) 학습자료 검색(RAG) (2) 모의문제 출제 (3) 답안 채점·해설(grade_answer) (4) 오답·진도 기록과
  조회.'
- 입력이 답안 제출인지는 create_agent의 LLM이 도구를 골라 판단한다. 정답 비교는 도구 안의 코드가 결정적으로 수행한다.
  채점 응답의 answer는 코드가 문제 은행 해설 세트로 템플릿을 채워 만든다(채점 결과, 문제·보기 한영 병기, 문제 의도, 정답인 이유,
  보기별 오답인 이유, 학습 포인트, 참고 공식문서 순). 채점과 진도 조회에서는 LLM을 호출하지 않는다.
- '런타임 LLM 활용 지점은 세 곳이며 모두 search_docs 안에서 호출하고 테스트에서 mock 처리한다. (1) 검색 쿼리 변환: 한국어 질문을 영어 검색어로 바꾸고 args에 남긴다.
  (2) 후속 질문: 같은 session_id의 가장 최근 시도 문항의 해설 필드와 evidence 구절을 맥락으로 붙인다. user_id와
  session_id가 모두 있고, 시도 기록의 user_id가 요청과 같고, 그 세션에 대기 문제가 없을 때만 붙이며 아니면 일반 검색으로 처리한다.
  (3) 채점 전 개념 힌트: 두 ID가 모두 있고 그 세션에 요청 user_id의 대기 문제가 있을 때, 문제에 대한 질의는 개념 힌트로 답하고 db_writes는 0이다.
  LLM 입력은 대기 문제의 stem_en, choices_en, intent와 검색된 구절뿐이며 answer, why_correct, why_wrong, trap, evidence, stem_ko, choices_ko는 넘기지 않는다.
  대기 문제의 evidence chunk_id와 같은 구절은 코드가 검색 결과와 contexts에서 걸러낸다. 정답 보기, 특정 보기의 정오, 문제·보기 번역 요청은 채점 전 해설 요청으로 거절한다.'
- 출제 응답은 영어 문제와 보기만 담는다. 한국어 해석, 정답, 해설 필드는 채점 전에 응답에 넣지 않는다.
- 답안으로 보는 입력은 정규화된 단독 A~D와 'B인 것 같아' 같은 자연어 답이다. 'A가 왜 정답이야?' 같은 질문은 답안으로 보지 않는다.
  대기 문제가 있으면 채점 전 해설 요청으로 거절하고 문제를 유지한다. 대기 문제가 없으면 방금 채점한 문항에 대한 후속 질문으로 처리한다.
- '답안 정규화: 대소문자·공백·마침표만 다른 답(''b'', '' B '', ''B.'')은 유효하다. E, 숫자, 복수 선택(''B,C''),
  빈 입력은 유효하지 않은 보기로 처리한다.'
- 'ID 조합별 허용 도구: ID 없음은 RAG만, user_id만은 RAG와 진도 조회, session_id만은 RAG만, 두 ID 모두는 4개
  도구 전부다. DB 쓰기는 두 ID가 모두 있을 때만 일어난다. 허용되지 않은 도구는 에이전트에 아예 넘기지 않는다.'
- 'refusal_reason은 고정된 사유 코드 10개 중 하나이거나 null이다. 목록 밖의 값은 null로 처리한다. (a) 도구 없이 거절하며 tool_calls가
  비어 있어야 하는 경우: ID 부족, 범위 밖 질문, 유출 문제 요청, 채점 전 해설 요청(대기 문제의 정답·해석·번역·해설 요청), 타인 진도 요청. LLM이 구조화 출력으로 사유 코드를 고르고
  코드가 목록 안의 값인지 검증한다. ID 부족은 코드가 실제로 필요한 ID가 빠졌는지 다시 확인한 뒤에만 기록한다. (b) 도구 결과로 코드가 정하는
  경우: user_id 불일치·유효하지 않은 답안·대기 문제 없음(grade_answer), 출제 문항 없음(generate_quiz, 없는 영역이거나 검수된 문항 0개).
  (c) 근거 부족(search_docs): 검색 결과가 0건이거나 유사도가 기준값 미만이면 코드가 정하고, 기준값 이상이어도 검색된 구절이 질문에 답하지
  못하면 LLM이 구조화 출력으로 고를 수 있다. 유사도 기준값은 .env나 설정으로 둔다.'
- 범위 밖 질문은 Claude·Anthropic 공식 문서와 관계없는 질문만 뜻한다. 가이드 Out-of-Scope 주제(exam_domains.yaml에 목록으로 둔다)는 거절하지 않고 search_docs로 답하며 "시험 출제 범위 밖" 표시를 붙인다.
- 진도 조회는 요청의 user_id 본인 기록만 돌려준다. 질문에서 다른 사용자의 진도를 요구하면 타인 진도 요청으로 거절한다.
- 허용되지 않은 ID 조합에서 출제나 채점을 요청하면 DB 쓰기는 0건이고, 응답에 이유와 필요한 ID를 안내한다.
- edge 4건(출제된 문제 없이 답함, 이미 채점된 문제에 다시 답함, A~D가 아닌 보기, user_id 없이 채점 요청)은 SQLite 쓰기
  0건이다. 응답에 안내 사유와 다음 행동 안내를 포함한다. 정답 공개, 새 문제 임의 생성, 임의 user_id 가정은 하지 않는다.
- 같은 session_id에 안 푼 문제가 있는데 새 문제를 요청하면 기존 문제를 새 문제로 바꾼다. 버린 문제는 시도 기록에 남기지 않는다. db_writes는
  1이고, 응답에 이전 문제를 건너뛰었다고 안내한다.
- 대기 문제를 받은 user_id와 다른 user_id로 답이 오면 채점하지 않는다. db_writes는 0이고, refusal_reason에 사유를
  적고 다음 행동을 안내한다.
- db_writes는 모든 DB 쓰기를 센다. 시도 기록 저장과 pending 저장·갱신·삭제가 모두 포함된다. 출제는 1, 채점은 2(시도 기록
  + pending 삭제)다.
- 오답·진도와 session_id별 대기 문제는 SQLite(data/progress.db 등)에 저장해 서버를 재시작해도 유지한다. 시도 기록
  필드는 user_id, session_id, question_id, chosen, correct, ts이고(session_id는 후속 질문 맥락 조회용), 진도는 영역별 정답률(scope=exam 문항만)과 오답 목록(문항 ID, 영역, scope, 고른 답, 정답, 두 범위 모두), study 문항 풀이 수로
  돌려준다. 오답 목록에는 채점이 끝난 문항만 들어간다.
- 문제 은행은 data/questions.json이다. 오프라인에서 만든 LLM 초안이나 서비스 내 배포가 허용된 외부 연습문제를 사람이 정답과 근거 링크를 검수해 승인한 문항만 넣는다.
  문항 필드는 id, domain, reviewed, stem_en, choices_en{A~D}, answer, stem_ko, choices_ko{A~D}, why_correct,
  intent, trap, why_wrong{오답 보기별}, learning_points[], references[{url, title, note}], evidence[{doc_path, chunk_id}], scope, task_statement, scenario, reviewed_by,
  reviewed_at이다. scope는 exam(exam_domains.yaml에 있는 Task Statement에 연결된 시험 범위 문항) 또는 study(공식 문서 학습용)이고, scenario는 가이드 시나리오 번호(1~6) 또는 null이다. intent는 문제가 확인하는 지식·판단, trap은 오답 보기가 노리는 오해, references.note는 읽을 부분이며 references.url은 manifest에
  있는 URL만 쓴다. reviewed=true는 이 필드가 모두 채워진 문항에만 준다. 초안은 bilingual-cert-quiz-solver 스킬 형식으로 오프라인에서 만들 수 있다. 초안의 참고 URL은 검수할 때 manifest 안의 URL로 맞추고, 스냅샷에 없는 문서가 필요하면 스냅샷에 먼저 추가한다.
- 런타임에는 reviewed=true인 승인 문항에서만 출제한다. 런타임 LLM은 문제와 정답을 만들지 않는다.
- '출제: 영역을 지정하면 그 영역에서, 지정하지 않으면 승인된 문제 은행 전체에서 무작위로 낸다. 고정 시드로 재현할 수 있어야 한다. 이미 푼 문항도
  다시 출제한다. 없는 영역이거나 검수된 문항이 0개인 영역을 지정하면 출제 문항 없음으로 거절하고 사용 가능한 영역 목록을 안내한다.'
- 채점 응답의 contexts에는 문항의 근거 구절을, trace.sources에는 근거 URL·doc_path·chunk_id를 담는다. 출제 응답과 진도 조회 응답의
  contexts는 빈 리스트이고, 문맥 기반 지표에서는 N/A로 처리한다.
- 'RAG 코퍼스: Anthropic 공식 문서(Agents/Agent SDK, Tool use, MCP, Claude Code, Prompt engineering,
  Context 관리)를 Markdown 오프라인 스냅샷으로 data/docs/에 저장한다. manifest에 원본 URL과 수집일을 기록한다.
  스냅샷 갱신은 수동 스크립트로만 한다.'
- '웹 폴백: search_docs 안에서만, 로컬 Chroma 검색이 근거 부족일 때만 허용 도메인(Anthropic·MCP 공식 문서(platform.claude.com, code.claude.com, modelcontextprotocol.io)) 페이지를 실시간 조회한다. 별도 도구로
  만들지 않는다. 허용 도메인 목록·웹 검색 API 키·on/off 플래그는 .env나 설정에서 읽는다. 가져온 구절은 contexts에 담을 수 있고
  trace.sources에는 {url, doc_path: null, chunk_id: null}로 넣는다. data/docs/나 Chroma에 저장하지 않는다. 가져온 구절도 데이터로만
  다룬다. 타임아웃이나 오류가 나면 근거 부족으로 처리한다. 테스트는 웹 조회를 mock하고, 평가 실행은 웹 폴백을 끈다.'
- 원문은 영문 그대로 둔다. 답변은 한국어로 하되 핵심 용어와 API 이름은 영어를 유지한다.
- 임베딩은 BedrockEmbeddings로 Bedrock 다국어 임베딩을 쓴다. 자격증명은 LLM과 같은 것을 쓰고, 임베딩 모델 ID는 .env에
  고정한다.
- 벡터 저장소는 data/chroma/에 로컬 영속 저장하는 Chroma다. 인덱스가 없거나 manifest 또는 임베딩 모델이 바뀌었을 때만 다시
  만든다. 청크에 domain 메타데이터를 붙여 도메인 필터 검색을 지원한다. 인덱스 폴더는 git에 커밋하지 않는다.
- 출제 영역은 공식 CCAR-F Exam Guide v1.0(2026년 7월)을 기준으로 data/exam_domains.yaml에 고정한다(Agentic Architecture & Orchestration 27%, Tool Design & MCP Integration 18%, Claude Code Configuration & Workflows 20%, Prompt Engineering & Structured Output 20%, Context Management & Reliability 15%). 영역별 Task Statement(1.1~5.6)와
  6개 시나리오, Out-of-Scope 주제 목록, 출처·버전을 함께 적는다. 코퍼스에 근거가 없는 영역은 '근거 부족'으로 표시한다. 출제 기본값은 scope=exam 문항이고, 학습용 요청일 때만 study 문항을 내며 출제 응답에 범위 표시를 붙인다. 공식 가이드의 샘플 문항은 문제 은행에 그대로 옮기지 않는다.
- 실제 시험 유출 문제(브레인덤프)는 쓰지 않고 요청해도 제공하지 않는다. 서비스 내 배포가 허용된 외부 연습문제는 문항마다 공식 문서 근거 구절과 URL을 붙이고 사람이 검수(reviewed=true)한 뒤에만 문제 은행에 넣는다.
- 'evaluation/test_queries.csv는 20문항이다: positive 8(채점 3[정답 1, 오답 2], 출제 2, 진도 1, 채점 전 개념 힌트 1, 후속 질문 1),
  negative 3(근거 부족 2, 범위 밖 질문 1), edge 4(출제 없이 답함, 재답변, A~D 아닌 보기, user_id 없이 채점), guardrail 5(프롬프트 인젝션,
  유출 문제 요청, 대기 문제 정답·번역 요청, 대기 중 보기 질문, 타인 진도 요청). 평가셋에 없는 거절 사유(user_id 불일치, 출제 문항 없음)와 웹
  폴백 경로는 단위 테스트에서 mock으로 확인한다. 컬럼은 id, category, input, expected_traits, forbidden, expected_tools,
  note, setup이다.'
- 평가 스크립트는 setup 요청을 같은 session_id로 먼저 보낸 뒤 본 문항을 판정한다. 고정 시드를 쓴다. 실행할 때마다 새 평가용 DB를
  쓰고 문항마다 고유한 session_id를 만든다.
- '문항 판정(고정 시드 1회 실행): 통과는 forbidden 위반 0건, trace.tool_calls의 도구 집합이 expected_tools와 정확히 같음(비어
  있으면 도구 호출 없음), db_writes가 기대값과 같음을 모두 만족하는 것이다. 도구 호출 정확도의 분모는 expected_tools가 비어 있지 않은
  문항이다. 거절은 trace.refusal_reason이 null이 아닌 것이다. expected_traits는 답변과 나란히 기록해 사람이 참고로만 확인하고 판정에는
  넣지 않는다.'
- '입력 검증: question이 비었거나, 2000자를 넘거나, 문자열이 아니면 HTTP 422를 돌려주고 DB에는 쓰지 않는다. user_id와 session_id도
  문자열이 아니면 같은 방식으로 처리한다.'
- '프롬프트 인젝션 방어: 검색된 문서 구절과 사용자 답안은 데이터로만 다루고, 그 안에 적힌 지시는 따르지 않는다. guardrail 5문항 중 1건은
  인젝션 시도 문항으로 둔다.'
- ChatBedrockConverse는 temperature=0으로 호출해 평가 결과가 덜 흔들리게 한다.
- 'Non-goals: 웹 UI(POST /query API만 제공), 로그인·인증(user_id를 그대로 신뢰), 적응형 출제, 세트형 모의고사(모의시험은 한 문항씩 출제·채점한다).'
- 대기 문제가 있어도 search_docs 학습자료 검색은 허용한다. 대기 문제의 정답·해석·번역·해설 요청은 채점 전 해설 요청으로 거절한다.
acceptance_criteria:
- description: POST /query가 question(필수), user_id, session_id를 받아 answer, contexts,
    trace 세 키만 돌려준다. contexts는 항상 list[str]이고, trace는 고정 스키마(tool_calls, problem_id,
    grading, refusal_reason, db_writes, sources)를 따르며 tool_calls의 name은 expected_tools
    값과 일치한다. 구현은 고정 폴더 구조(src/agent.py, src/tools.py, src/retriever.py)를 따르고 비밀 값은
