  verify_command: python -m pytest -q tests/test_grading.py
- description: ID 조합별 도구 허용 규칙이 지켜지고, 허용되지 않은 조합의 출제·채점 요청은 이유와 필요한 ID를 안내하며 DB 쓰기
    0건이다. session_id별 대기 문제는 서버를 재시작해도 유지된다. 새 문제를 요청하면 대기 문제를 교체하고(db_writes=1, 건너뜀
    안내, 시도 기록 없음), user_id가 다르면 채점을 거절한다(db_writes=0, refusal_reason 기록).
