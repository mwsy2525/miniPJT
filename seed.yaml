assumptions:
- HTTP 서버 프레임워크는 FastAPI를 가정한다.
- 도구 함수 이름은 search_docs, generate_quiz, grade_answer, get_progress로 가정한다. 단 grade_answer는
  사용자가 정한 이름이다.
- '세부 동작 검증용 pytest 파일은 작업자가 작성한다: tests/test_api_contract.py, tests/test_grading.py,
  tests/test_session_rules.py, tests/test_quiz.py, tests/test_question_bank.py, tests/test_corpus.py,
  tests/test_evaluation_report.py. 테스트는 Bedrock 호출을 대체(mock)해 오프라인에서도 돌 수 있게 한다.'
- 코퍼스 manifest 경로는 data/docs/manifest.json으로 가정한다.
- 평가 실행 스크립트는 evaluation/run_eval.py, 평가 리포트는 evaluation/report.md 또는 evaluation/report.json으로
  가정한다.
- SQLite 파일 경로는 data/progress.db를 기본으로 하고, 평가 때는 임시 경로로 바꿀 수 있다고 가정한다.
- Cohere Embed Multilingual은 예시일 뿐이다. 실제 임베딩 모델 ID는 .env 값을 따른다.
- 보기는 A~D 단일 정답 4지선다로 가정한다. 공식 시험의 복수 응답(multiple-response) 문항은 이번 범위 밖이다.
- 사용 대상은 한국어를 쓰는 CCAR-F 응시 예정자이며 인원을 한정하지 않는다. 이번 범위는 동시 사용자 수십 명 이하의 소규모 운영을 가정해 SQLite와 로컬 Chroma를 쓴다. 인증이 없어 user_id를 그대로 믿고 LLM 호출 비용이 남용될 수 있으므로, 불특정 다수에게 공개 운영하기 전에는 인증과 호출 제한(rate limit)을 먼저 넣어야 한다.
- MVP(제출용)에서 근거 부족이 아닌 영역마다 scope=exam인 reviewed=true 문항이 2개 이상이면 된다. 실사용 시작 기준은 그런 영역당 5문항이고, 가이드 비중대로 배분한 총 약 50문항(Domain 1~5에 14, 9, 10, 10, 7) 전부 검수는 목표로만 둔다.
ontology_schema:
  name: CCARFStudyAgent
  description: CCAR-F 학습 에이전트의 도메인 모델. 시험 영역, 공식 문서 코퍼스 청크, 검수된 문제 은행 항목, 세션별 대기 문제,
    user_id별 시도 기록, /query 요청·응답 규약, 평가 문항을 다룬다.
  fields:
  - name: ExamDomain
    type: object
    description: data/exam_domains.yaml의 출제 영역(name, weight, task_statements, 근거 부족 표시, 영역별 관련 문서 doc_path 목록, 출처 Exam Guide v1.0)
    required: true
  - name: DocChunk
    type: object
    description: data/docs/ 원문 청크(chunk_id, doc_path, url, domain, text). Chroma에
      domain 메타데이터와 함께 인덱싱된다.
    required: true
  - name: CorpusManifest
    type: object
    description: 스냅샷 문서별 원본 URL과 수집일
    required: true
  - name: Question
    type: object
    description: 문제 은행 항목(id, domain, reviewed, stem_en, choices_en A~D, answer, stem_ko, choices_ko
      A~D, intent, trap, why_correct, why_wrong, learning_points, references[url, title, note], evidence[doc_path, chunk_id], reviewed_by,
      reviewed_at)
    required: true
  - name: PendingProblem
    type: object
    description: session_id별 풀고 있는 문제(session_id, user_id, problem_id). SQLite에 저장된다.
    required: true
  - name: Attempt
    type: object
    description: 시도 기록(user_id, session_id, question_id, chosen, correct, ts)
    required: true
  - name: Progress
    type: array
    description: user_id 본인의 영역별 정답률 집계와 오답 목록(question_id, domain, chosen, correct)
    required: true
  - name: RefusalReason
    type: string
    description: 'trace.refusal_reason 사유 코드 10개: ID 부족, user_id 불일치, 범위 밖 질문, 근거 부족, 유출 문제 요청,
      유효하지 않은 답안, 채점 전 해설 요청, 타인 진도 요청, 대기 문제 없음, 출제 문항 없음'
    required: true
  - name: QueryRequest
    type: object
    description: '{question:string, user_id?:string, session_id?:string}'
    required: true
  - name: QueryResponse
    type: object
    description: '{answer:string, contexts:list[str], trace:Trace}'
    required: true
  - name: Trace
    type: object
    description: '{tool_calls:[{name,args}], problem_id, grading:{chosen,correct}|null,
      refusal_reason:str|null, db_writes:int, sources:[{url,doc_path,chunk_id}]}'
    required: true
  - name: TestQuery
    type: object
    description: 평가 문항(id, category, input, expected_traits, forbidden, expected_tools,
      note, setup)
    required: true
  - name: Tool
    type: object
    description: 에이전트 도구 4개(search_docs, generate_quiz, grade_answer, get_progress). trace.tool_calls의 name과 expected_tools 값이 이 이름과 같다.
    required: true
  - name: Session
    type: object
    description: '요청 식별 맥락 {user_id?, session_id?}. 이 조합에 따라 허용 도구와 DB 쓰기 여부가 정해진다.'
    required: true
  - name: Source
    type: object
    description: '근거 출처 {url, doc_path, chunk_id}. trace.sources에 담긴다.'
    required: true
  - name: EvalReport
    type: object
    description: 전체 통과율, 도구 호출 정확도, 카테고리별 통과, 과잉 거절 수, db_writes 일치율, RAG 지표 측정값
    required: true
evaluation_principles:
- name: Contract fidelity
  description: POST /query 입출력 규약(answer, contexts, trace 세 키와 고정 trace 스키마)과 고정 폴더
    구조를 정확히 지킨다.
  weight: 0.2
- name: Deterministic correctness
  description: 채점은 문제 은행 정답 키와 코드로 비교해 결정적이다. 출제는 검수된 문항에서만 하고 고정 시드로 재현할 수 있다.
  weight: 0.2
- name: No fabrication and safe refusal
  description: 없는 정보, 유출 문제 요청, 범위 밖 질문, 채점 전 해설 요청, 타인 진도 요청에 지어내지 않고 고정 사유 코드로 거절·안내하며,
    positive 문항을 과잉 거절하지 않는다.
  weight: 0.2
- name: State integrity
  description: ID 허용 규칙, 대기 문제 생애주기, user_id 불일치 거절, db_writes 계수가 명세와 정확히 일치한다.
  weight: 0.2
- name: Grounded answers
  description: 한국어 답변이 오프라인 공식 문서 원문 구절과 URL 근거에 기반한다.
  weight: 0.1
- name: Measurable evaluation
  description: 20문항 평가셋과 격리된 평가 실행으로 합격 기준을 자동 판정하고 리포트를 남긴다.
  weight: 0.1
exit_conditions:
- name: All acceptance criteria pass
  description: 모든 수용 기준의 verify 명령이 통과한다.
  criteria: AC 7개 verify 전부 성공
- name: Evaluation thresholds met
  description: 평가 리포트가 합격 기준을 충족한다.
  criteria: 전체 ≥85%, 도구 정확도 ≥90%, negative·guardrail 100%, 과잉 거절 0, edge·guardrail의
    forbidden 위반 0과 db_writes 일치 100%
- name: MVP question bank ready
  description: 영역마다 검수된 문항이 충분하다.
  criteria: exam_domains.yaml에서 근거 부족이 아닌 영역마다 해설 세트를 갖춘 scope=exam, reviewed=true 문항 2개 이상
- name: Blocked by external dependency
  description: Bedrock 자격증명이나 모델 접근이 없어 실제 평가를 실행할 수 없다.
  criteria: .env 자격증명 부재 또는 Bedrock 호출 실패가 반복되면 중단하고 보고한다
