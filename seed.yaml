    승인된 문제 은행의 정답 키와 결정적으로 비교해서 한다. 대소문자·공백·마침표 차이는 정규화해 인정하고, 채점 결과는
    user_id별 시도 기록으로 SQLite에 남으며(db_writes=2) 영역별 정답률과 오답 목록으로 본인 것만 조회된다. edge 4건(출제된 문제 없음,
    재답변, A~D가 아닌 보기, user_id 없음)은 db_writes 0, 안내 사유와 다음 행동 안내를 포함하며 정답 공개, 새 문제 생성,
    임의 user_id 가정을 하지 않는다. 채점 응답의 answer는 문제 은행 해설 세트(한영 병기 해석, 문제 의도, 정답인 이유, 보기별 오답인 이유,
    학습 포인트, 참고 공식문서)를 코드 템플릿으로 그대로 담고, 채점 경로에서는 LLM을 호출하지 않는다.
