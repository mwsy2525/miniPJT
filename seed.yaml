    거절하고 사용 가능한 영역 목록을 안내한다. 출제 응답의 answer는 영어 문제와 보기만 담고 한국어 해석·정답·해설은 담지 않는다. 출제 응답의 contexts와 trace.sources는 빈 리스트다. 채점 응답의 contexts에는 문항의 근거 원문 구절이, trace.sources에는 근거 URL·doc_path·chunk_id가 담긴다.
